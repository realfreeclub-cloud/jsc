<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B400" />
      <stop offset="50%" stop-color="#FFD24C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#07152F" stroke="url(#gold-grad)" stroke-width="4" />
  
  <!-- Inner Gold Circle Accent -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  
  <!-- Premium Stylized Letter "J" -->
  <text x="50" y="68" font-family="'Playfair Display', 'Didot', 'Georgia', serif" font-weight="900" font-size="52" fill="url(#gold-grad)" text-anchor="middle" filter="url(#glow)">J</text>
</svg>
